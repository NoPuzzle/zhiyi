<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">知易 · 观象</title>
  <desc id="description">暖米纸背景上的知易标题、山水墨痕与泰卦六爻，题词为以象入易，以问观心。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3e9" />
      <stop offset="0.55" stop-color="#f3ecdf" />
      <stop offset="1" stop-color="#ebe1d1" />
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e4a43" stop-opacity="0.02" />
      <stop offset="1" stop-color="#4e4a43" stop-opacity="0.22" />
    </linearGradient>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.42
        0 0 0 0 0.39
        0 0 0 0 0.34
        0 0 0 0.055 0" result="grain" />
      <feBlend in="SourceGraphic" in2="grain" mode="multiply" />
    </filter>
  </defs>

  <rect width="1200" height="440" rx="8" fill="url(#paper)" filter="url(#paper-grain)" />

  <g fill="none" stroke="#4e4a43" stroke-linecap="round">
    <path d="M0 361 C111 321 188 330 280 367 C376 406 473 399 564 363" stroke-width="2" opacity="0.12" />
    <path d="M0 389 C123 356 216 368 314 398 C420 430 503 417 610 381" stroke-width="14" opacity="0.045" />
    <path d="M728 390 C839 353 949 363 1200 413" stroke-width="2" opacity="0.1" />
  </g>

  <path d="M0 326 C75 284 137 256 203 278 C250 294 276 331 331 337 C390 344 449 308 518 283 L518 440 L0 440 Z" fill="url(#wash)" opacity="0.38" />
  <path d="M703 440 C767 395 810 368 864 378 C907 386 936 410 980 405 C1035 399 1087 360 1200 334 L1200 440 Z" fill="#4e4a43" opacity="0.055" />

  <g fill="#171512">
    <text x="92" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="4" opacity="0.58">ZHIYI · OBSERVING CHANGE</text>
    <text x="88" y="190" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="72" letter-spacing="8">知易 · 观象</text>
    <text x="94" y="244" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" letter-spacing="7" opacity="0.74">以象入易，以问观心</text>
    <line x1="94" y1="280" x2="458" y2="280" stroke="#171512" stroke-width="1" opacity="0.16" />
    <text x="94" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="15" letter-spacing="1.4" opacity="0.5">SEE CHANGE · UNDERSTAND YOURSELF</text>
  </g>

  <g fill="#171512" opacity="0.9">
    <rect x="820" y="92" width="68" height="12" rx="1" />
    <rect x="912" y="92" width="68" height="12" rx="1" />
    <rect x="820" y="132" width="68" height="12" rx="1" />
    <rect x="912" y="132" width="68" height="12" rx="1" />
    <rect x="820" y="172" width="68" height="12" rx="1" />
    <rect x="912" y="172" width="68" height="12" rx="1" />
    <rect x="820" y="212" width="160" height="12" rx="1" />
    <rect x="820" y="252" width="160" height="12" rx="1" />
    <rect x="820" y="292" width="160" height="12" rx="1" />
  </g>

  <g fill="#4e4a43">
    <text x="1028" y="109" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" opacity="0.56">上</text>
    <text x="1028" y="307" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" opacity="0.56">初</text>
    <text x="820" y="354" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="16" letter-spacing="5" opacity="0.66">天地交 · 万物通</text>
  </g>
</svg>
